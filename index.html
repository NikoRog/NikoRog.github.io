<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikola Rogulja</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-light" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">Portfolio</p>
        <h1>Nikola Rogulja</h1>
      </div>
      <div class="hero-links">
        <a href="#about">contact</a>
      </div>
    </header>

    <section class="section">
      <div class="section-head">
        <h2>art explorer</h2>
      </div>
      <div id="art-links" class="art-links"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>game shelf</h2>
      </div>
      <div class="project-shelf">
        <button class="shelf-arrow" id="shelf-prev" type="button" aria-label="Previous projects">‹</button>
        <div id="project-list" class="project-list"></div>
        <button class="shelf-arrow" id="shelf-next" type="button" aria-label="Next projects">›</button>
      </div>
      <div id="project-detail-host"></div>
    </section>

    <section class="section" id="about">
      <div class="section-head">
        <h2>about me</h2>
      </div>
      <div class="about-box">
        <p>Game design, art, and interactive work.</p>
        <div class="about-links">
          <a href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="mailto:hello@example.com">Mail</a>
          <a href="assets/cv.pdf" target="_blank" rel="noopener noreferrer">CV</a>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
